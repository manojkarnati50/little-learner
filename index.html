.card.play{animation:pop .5s}

.wig{animation:wig .5s}@keyframes wig{20%,60%{transform:rotate(-8deg)}40%,80%{transform:rotate(8deg)}}
.row{display:flex;gap:40px;margin-top:80px}
.row .card{width:260px;height:280px}.row .card .e{font-size:150px}
.ph{width:300px;height:210px}.ph .en{font-size:24px;text-align:center}

#cv{background:#fff;border-radius:40px;box-shadow:0 10px 0 rgba(0,0,0,.1);touch-action:none}
.side{display:flex;flex-direction:column;gap:20px}
#mic .rec{width:220px;height:220px;font-size:120px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:9}
.star{position:fixed;font-size:160px;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);z-index:10;pointer-events:none}
.star.go{animation:star 1.2s ease-out}@keyframes star{30%{transform:translate(-50%,-50%) scale(1.3)}70%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-90%) scale(0);opacity:0}}

function resample(pts,step=.012){const o=[pts[0]];for(let i=1;i<pts.length;i++){const[a,b]=[pts[i-1],pts[i]];const d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(d/step));for(let k=1;k<=n;k++)o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}return o}
function setBusy(v){busy=v;cv.dataset.busy=v?'1':'0'}
function setupTrace(){const h=Math.min(innerHeight-40,760);const dpr=window.devicePixelRatio||1;cv.width=cv.height=Math.round(h*dpr);cv.style.width=cv.style.height=h+'px';cv.style.touchAction='none';S=h;strokes=LET[KEYS[li]].map(s=>resample(s));si=0;prog=0;ink=[];started=false;pid=null;inputMode=null;setBusy(false);cv.dataset.phase='ready';cv.dataset.letter=KEYS[li];cv.dataset.letterDone='';draw()}
const X=p=>(p[0]*S),Y=p=>(p[1]*S);
function posFrom(clientX,clientY){const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;const sx=(cv.width/Math.max(r.width,1))/dpr;const sy=(cv.height/Math.max(r.height,1))/dpr;return[(clientX-r.left)*sx,(clientY-r.top)*sy]}
function clientFromCanvas(x,y){const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;const sx=(cv.width/Math.max(r.width,1))/dpr;const sy=(cv.height/Math.max(r.height,1))/dpr;return[r.left+x/sx,r.top+y/sy]}
window.__tracePath=function(){return strokes.map(s=>s.map(p=>clientFromCanvas(X(p),Y(p))))};
function path(pts,upto){c.beginPath();c.moveTo(X(pts[0]),Y(pts[0]));for(let i=1;i<=Math.min(upto,pts.length-1);i++)c.lineTo(X(pts[i]),Y(pts[i]));c.stroke()}
function draw(){c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);c.clearRect(0,0,S,S);c.lineCap=c.lineJoin='round';
// sun at top = "top" cue, ground at bottom
c.font=S*.07+'px serif';c.fillText('☀️',S*.02,S*.08);c.fillStyle='#c8f0b0';c.fillRect(0,S*.93,S,S*.07);
strokes.forEach((s,i)=>{c.strokeStyle='#eee';c.lineWidth=S*.11;path(s,1e9);c.setLineDash([2,S*.035]);c.strokeStyle=i<si?'transparent':'#bbb';c.lineWidth=S*.018;path(s,1e9);c.setLineDash([])});
strokes.forEach((s,i)=>{if(i<si){c.strokeStyle=COLS[i%5];c.lineWidth=S*.075;path(s,1e9)}});
if(si<strokes.length){const s=strokes[si];c.strokeStyle=COLS[si%5];c.lineWidth=Math.max(14,S*.08);if(prog>0)path(s,prog);
// arrow along current stroke (animated)
const k=Math.floor(((Date.now()-t0)/40)%s.length);const a=s[Math.min(k,s.length-2)],b=s[Math.min(k+1,s.length-1)];arrow(X(a),Y(a),Math.atan2(Y(b)-Y(a),X(b)-X(a)));
// start dot
const p=s[0],pulse=1+.12*Math.sin(Date.now()/150);c.fillStyle='#2fbf71';c.beginPath();c.arc(X(p),Y(p),S*.05*pulse,0,7);c.fill();c.fillStyle='#fff';c.font='bold '+S*.055+'px Arial';c.textAlign='center';c.textBaseline='middle';c.fillText(si+1,X(p),Y(p)+1);c.textAlign='start';c.textBaseline='alphabetic'}
if(ink.length>1){c.strokeStyle='#222';c.lineWidth=Math.max(10,S*.05);c.beginPath();c.moveTo(ink[0][0],ink[0][1]);for(let i=1;i<ink.length;i++)c.lineTo(ink[i][0],ink[i][1]);c.stroke()}}
function arrow(x,y,a){c.save();c.translate(x,y);c.rotate(a);c.fillStyle='#ff7a00';c.beginPath();c.moveTo(S*.04,0);c.lineTo(-S*.025,-S*.03);c.lineTo(-S*.025,S*.03);c.fill();c.restore()}
(function loop(){if($('#tr').classList.contains('on')&&!busy)draw();requestAnimationFrame(loop)})();t0=Date.now();
const tol=()=>S*.18;
function near(x,y){const s=strokes[si];let best=-1;for(let i=prog;i<Math.min(s.length,prog+24);i++){if(Math.hypot(X(s[i])-x,Y(s[i])-y)<tol())best=i}return best}
function beginAt(x,y){if(busy||!strokes||si>=strokes.length)return false;const s=strokes[si];started=Math.hypot(X(s[0])-x,Y(s[0])-y)<tol();ink=[[x,y]];prog=0;if(started){const n=near(x,y);if(n>prog)prog=n}else pulseStart();draw();window.__traceStarted=started;return true}
function extend(x,y){if(!started)return;ink.push([x,y]);const n=near(x,y);if(n>prog)prog=n;draw()}
function finishStroke(){if(!started){ink=[];return}const s=strokes[si];if(prog>=s.length-3){boop();tone(880,.08,.15,'triangle',.15);si++;prog=0;ink=[];started=false;draw();if(si>=strokes.length){cv.dataset.letterDone=KEYS[li];setBusy(true);say('Super! '+KEYS[li]+'! Well done, '+CHILD_NAME+'!');try{confetti()}catch(e){}setTimeout(()=>setBusy(false),2500)}}else{prog=0;ink=[];started=false;pulseStart();draw()}}
function pos(e){return posFrom(e.clientX,e.clientY)}
cv.addEventListener('pointerdown',e=>{if(inputMode==='touch')return;if(busy||!strokes||si>=strokes.length)return;if(pid!==null)return;inputMode='pointer';pid=e.pointerId;try{cv.setPointerCapture(pid)}catch(err){}const[x,y]=pos(e);beginAt(x,y)});
cv.addEventListener('pointermove',e=>{if(inputMode!=='pointer'||e.pointerId!==pid||!started)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs){const[x,y]=pos(ev);extend(x,y)}});
function pointerUp(e){if(inputMode!=='pointer'||e.pointerId!==pid)return;pid=null;inputMode=null;finishStroke()}
cv.addEventListener('pointerup',pointerUp);cv.addEventListener('pointercancel',pointerUp);
function touchXY(e){const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0]);return posFrom(t.clientX,t.clientY)}
cv.addEventListener('touchstart',e=>{e.preventDefault();if(inputMode==='pointer')return;if(busy||!strokes||si>=strokes.length)return;inputMode='touch';const[x,y]=touchXY(e);beginAt(x,y)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(inputMode!=='touch'||!started)return;const[x,y]=touchXY(e);extend(x,y)},{passive:false});
function touchEnd(e){e.preventDefault();if(inputMode!=='touch')return;inputMode=null;finishStroke()}
cv.addEventListener('touchend',touchEnd,{passive:false});
cv.addEventListener('touchcancel',touchEnd,{passive:false});
let lastHint=0;function pulseStart(){if(Date.now()-lastHint<2500)return;lastHint=Date.now();say('Start at the green dot')}
async function demo(){if(busy)return;setBusy(true);cv.dataset.phase='demo';si=0;prog=0;ink=[];started=false;try{for(let k=0;k<strokes.length;k++){si=k;const s=strokes[k];for(let i=0;i<s.length;i++){prog=i;draw();const p=s[i];c.font=S*.1+'px serif';c.fillText('☝️',X(p)-S*.03,Y(p)+S*.09);await new Promise(r=>setTimeout(r,28))}}await new Promise(r=>setTimeout(r,500))}finally{si=0;prog=0;ink=[];started=false;pid=null;inputMode=null;setBusy(false);cv.dataset.phase='ready';draw()}}
bind($('#watch'),()=>demo());bind($('#clr'),()=>{boop();si=0;prog=0;ink=[];started=false;inputMode=null;pid=null;setBusy(false);cv.dataset.phase='ready';cv.dataset.letterDone='';draw()});
bind($('#nextL'),()=>{li=(li+1)%KEYS.length;boop();setupTrace();say(KEYS[li])});
bind($('#prevL'),()=>{li=(li+KEYS.length-1)%KEYS.length;boop();setupTrace();say(KEYS[li])});
bind($('#sayL'),()=>say(KEYS[li]));
// ===== mic =====
let rec,chunks=[],url=null;
$('#recb').onclick=async()=>{const b=$('#recb');if(rec&&rec.state==='recording'){rec.stop();return}
try{const st=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(st);rec.ondataavailable=e=>chunks.push(e.data);
rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));b.textContent='🔴';b.classList.remove('wig');$('#playb').style.opacity=1;playBack()};
rec.start();b.textContent='⏹️';b.classList.add('wig');setTimeout(()=>rec.state==='recording'&&rec.stop(),5000)}catch(e){b.classList.add('wig')}};
function playBack(){if(!url)return;const a=new Audio(url);a.onended=()=>confetti();a.play()}
$('#playb').onclick=playBack;
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
