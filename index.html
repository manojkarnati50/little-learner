<style>

function moveHand(points){const h=$('#hand');if(!h||!points.length)return;hideHand();h.classList.add('on');let i=0;const step=()=>{if(!h.classList.contains('on'))return;const p=points[i%points.length];h.style.left=p[0]+'px';h.style.top=p[1]+'px';i++;if(i<points.length)handTimer=setTimeout(step,700);else handTimer=setTimeout(()=>h.classList.remove('on'),900)};step()}
function cardPoint(el){const r=el.getBoundingClientRect();return [r.left+r.width*.55,r.top+r.height*.15]}
function pairHint(demo){const cards=[...$('#memgrid').children];const first=cards.find(c=>c.dataset.ic);if(!first)return;const mate=cards.find(c=>c!==first&&c.dataset.ic===first.dataset.ic);if(!mate)return;const a=cardPoint(first),b=cardPoint(mate);moveHand(demo?[a,b,a,b]:[a,b])}
function newMem(quiet){clearTimeout(memTimer);hideHand();memLock=true;const icons=['🍎','🐶','⭐','🐱','🍌','🌸','🐟','🎈'];const pick=icons.slice().sort(()=>Math.random()-.5).slice(0,2);const deck=pick.concat(pick).sort(()=>Math.random()-.5);const grid=$('#memgrid');grid.style.gridTemplateColumns='repeat(2,210px)';grid.innerHTML='';let open=[];
deck.forEach(ic=>{const b=document.createElement('button');b.textContent=ic;b.dataset.ic=ic;b.classList.add('show');
bind(b,()=>{if(memLock||b.classList.contains('show')||b.classList.contains('got'))return;hideHand();b.classList.add('show');open.push(b);if(open.length===2){memLock=true;if(open[0].dataset.ic===open[1].dataset.ic){open.forEach(x=>x.classList.add('got'));open=[];memLock=false;boop();if($$('#memgrid button.got').length===deck.length){confetti();addStar('mem','🃏');speakItems([{text:'Yes! Well done, '+CHILD_NAME+'!'},{text:'Find the two same pictures!'}]);memTimer=setTimeout(()=>{if(document.body.dataset.screen==='memory')newMem(true)},1700)}}else memTimer=setTimeout(()=>{open.forEach(x=>x.classList.remove('show'));open=[];memLock=false},700)}});grid.appendChild(b)});
let first=false;try{first=localStorage.getItem('ll-help-mem')!=='1';if(first)localStorage.setItem('ll-help-mem','1')}catch(e){}
if(!quiet)say('Find the two same pictures!');
if(first)setTimeout(()=>pairHint(true),60);
memTimer=setTimeout(()=>{$$('#memgrid button').forEach(b=>{if(!b.classList.contains('got'))b.classList.remove('show')});memLock=false;pairHint(false)},2000)}
let countN=1;
function newCount(){countN=1+Math.floor(Math.random()*10);const box=$('#countobjs');box.innerHTML='';for(let i=0;i<countN;i++){const s=document.createElement('span');s.textContent='🍎';box.appendChild(s)}
const nums=$('#countnums');if(!nums.childElementCount){for(let i=1;i<=10;i++){const b=document.createElement('button');b.textContent=String(i);bind(b,()=>{if(+b.textContent===countN){confetti();newCount();say('Yes! How many?')}else{b.classList.add('wig');say('Count again')}});nums.appendChild(b)}}}
const ODD=[['🐶','🐶','🐶','🍌'],['🍎','🍎','🍎','🚗'],['⭐','⭐','🌸','⭐'],['🐱','🐱','🐱','🐟'],['⚽','⚽','🥛','⚽']];
let oddI=0;
function newOdd(){const row=ODD[oddI%ODD.length].slice().sort(()=>Math.random()-.5);const counts={};row.forEach(x=>counts[x]=(counts[x]||0)+1);const odd=row.find(x=>counts[x]===1);const o=$('#oddopts');o.innerHTML='';
row.forEach(ic=>{const b=document.createElement('button');b.className='card';b.innerHTML='<div class="e">'+ic+'</div>';bind(b,()=>{if(ic===odd){oddI++;confetti();newOdd();say('Yes! Which one is different?')}else{b.classList.add('wig');say('Try again')}});o.appendChild(b)})}
const JIGPICS=['🌞','🏠','🐟','❤️','🎈','🦋','🐱','🌸','🚗','🌳','⛵','⭐'];
let jigPic=0,jigParts=2,jigHold=null;
function jigLayout(){return jigParts===2?{cols:2,rows:1,bw:440,bh:320}:{cols:2,rows:2,bw:440,bh:320}}
function newJig(quiet){hideHand();const board=$('#jboard'),tray=$('#tray');const pic=JIGPICS[jigPic%JIGPICS.length];const lay=jigLayout();const pw=lay.bw/lay.cols,ph=lay.bh/lay.rows;board.dataset.parts=String(jigParts);board.dataset.pic=pic;board.innerHTML='';tray.innerHTML='';
const ghost=document.createElement('div');ghost.className='jghost';ghost.textContent=pic;board.appendChild(ghost);
const zones=[];
for(let i=0;i<jigParts;i++){const col=i%lay.cols,row=Math.floor(i/lay.cols);const z=document.createElement('div');z.className='jzone';z.dataset.i=String(i);z.style.left=col*pw+'px';z.style.top=row*ph+'px';z.style.width=pw+'px';z.style.height=ph+'px';board.appendChild(z);zones.push(z)}
const order=[...zones].sort(()=>Math.random()-.5);
order.forEach(z=>{const i=+z.dataset.i,col=i%lay.cols,row=Math.floor(i/lay.cols);const p=document.createElement('div');p.className='jpiece';p.dataset.i=String(i);p.style.width=pw+'px';p.style.height=ph+'px';p.style.touchAction='none';
const g=document.createElement('div');g.className='g';g.textContent=pic;g.style.width=lay.bw+'px';g.style.height=lay.bh+'px';g.style.left=(-col*pw)+'px';g.style.top=(-row*ph)+'px';p.appendChild(g);
p.addEventListener('pointerdown',ev=>{if(p.dataset.placed)return;jigHold=p;try{p.setPointerCapture(ev.pointerId)}catch(e){}p.style.position='fixed';p.style.zIndex='8';p.style.left=(ev.clientX-pw/2)+'px';p.style.top=(ev.clientY-ph/2)+'px';hideHand()});
p.addEventListener('pointermove',ev=>{if(jigHold!==p)return;p.style.left=(ev.clientX-pw/2)+'px';p.style.top=(ev.clientY-ph/2)+'px'});
p.addEventListener('pointerup',ev=>{if(jigHold!==p)return;jigHold=null;const zr=z.getBoundingClientRect();const hit=ev.clientX>zr.left-36&&ev.clientX<zr.right+36&&ev.clientY>zr.top-36&&ev.clientY<zr.bottom+36&&!z.dataset.filled;if(hit){p.style.left=zr.left+'px';p.style.top=zr.top+'px';p.style.transition='left .15s ease,top .15s ease';p.dataset.placed='1';z.dataset.filled='1';boop();if($$('#tray .jpiece').every(x=>x.dataset.placed)){confetti();addStar('jig-'+jigParts,'🧩');const nextFour=jigParts===2;speakItems([{text:'Yes! Well done, '+CHILD_NAME+'!'},{text:'Put the picture together!'}]);if(nextFour)jigParts=4;else{jigParts=2;jigPic++}setTimeout(()=>{if(document.body.dataset.screen==='jigsaw')newJig(true)},1600)}else{p.style.position='';p.style.left='';p.style.top='';p.style.zIndex='';p.style.transition=''}}});
tray.appendChild(p)});
let first=false;try{first=localStorage.getItem('ll-help-jig')!=='1';if(first)localStorage.setItem('ll-help-jig','1')}catch(e){}
if(!quiet)say('Put the picture together!');
if(first)requestAnimationFrame(()=>{const piece=tray.querySelector('.jpiece');const zone=[...board.querySelectorAll('.jzone')].find(z=>z.dataset.i===piece.dataset.i);if(!piece||!zone)return;const pr=piece.getBoundingClientRect(),zr=zone.getBoundingClientRect();moveHand([[pr.left+pr.width*.45,pr.top+10],[zr.left+zr.width*.4,zr.top+8],[pr.left+pr.width*.45,pr.top+10],[zr.left+zr.width*.4,zr.top+8]])})}
const SORTS=[['🍎','fruit'],['🍌','fruit'],['🥭','fruit'],['🐶','animal'],['🐱','animal'],['🐟','animal'],['🐄','animal'],['🍊','fruit']];
let sortI=0,sortHold=false;
function newSort(){sortI=Math.floor(Math.random()*SORTS.length);$('#sortitem').textContent=SORTS[sortI][0]}
function answerSort(kind){const ok=SORTS[sortI][1]===kind;if(ok){confetti();newSort();say('Yes! Fruit or animal?')}else say('Try again')}
$$('[data-bin]').forEach(b=>bind(b,()=>answerSort(b.dataset.bin)));
$('#sortitem').addEventListener('pointerdown',e=>{sortHold=true;$('#sortitem').setPointerCapture(e.pointerId)});
$('#sortitem').addEventListener('pointerup',e=>{if(!sortHold)return;sortHold=false;$$('[data-bin]').forEach(b=>{const r=b.getBoundingClientRect();if(e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)answerSort(b.dataset.bin)})});
function markOff(){$$('.off').forEach(el=>{el.textContent='available offline ✓'})}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
navigator.serviceWorker.register('sw.js').then(reg=>{if(navigator.serviceWorker.controller)markOff();navigator.serviceWorker.addEventListener('controllerchange',markOff);return navigator.serviceWorker.ready}).then(markOff).catch(()=>{})}
const AVATARS=['bike','jump','pout','look','stand','laugh'];
let avatar='stand';
try{const savedAv=localStorage.getItem('ll-avatar');if(AVATARS.includes(savedAv))avatar=savedAv}catch(e){}
function mountMascot(el){const img=document.createElement('img');img.className='avatar-img';img.alt='';el.replaceChildren(img)}
mountMascot($('#mascot'));
const flo=document.createElement('div');flo.id='floater';flo.className='mascot floater';flo.setAttribute('aria-hidden','true');mountMascot(flo);document.body.appendChild(flo);
function applyAvatar(id){if(!AVATARS.includes(id))id='stand';avatar=id;try{localStorage.setItem('ll-avatar',id)}catch(e){}
$$('.mascot').forEach(m=>{m.dataset.avatar=id;const img=m.querySelector('img.avatar-img');if(img)img.src='assets/avatars/'+id+'.webp'});
$$('#pickgrid .avbtn').forEach(b=>b.classList.toggle('on',b.dataset.av===id))}
const pick=$('#pickgrid');
AVATARS.forEach(id=>{const b=document.createElement('button');b.type='button';b.className='avbtn';b.dataset.av=id;b.setAttribute('aria-label',id);
const img=document.createElement('img');img.src='assets/avatars/'+id+'.webp';img.alt='';b.appendChild(img);
bind(b,()=>{applyAvatar(id);go('home')});pick.appendChild(b)});
applyAvatar(avatar);
</script></body></html>
