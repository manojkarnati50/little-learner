<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;background:linear-gradient(160deg,#fff4d6,#ffe0ec 60%,#d9f2ff)}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:16px 16px 16px 16px}
.screen.on{display:flex}
h1{margin:4px 0 8px;font-size:40px;color:#ff5c8a;text-shadow:3px 3px 0 #fff}
.home{display:grid;grid-template-columns:repeat(4,168px);gap:14px}
.big{width:168px;height:132px;border:none;border-radius:32px;font-size:58px;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center}
.big small{font-size:18px;margin-top:2px}
.big:active,.card:active,.tbtn:active,.lb:active{transform:scale(.94)}
#home.on{flex-direction:row;justify-content:center;align-items:center;gap:18px}
.hero{width:280px;display:flex;flex-direction:column;align-items:center}
.mascot{width:240px;height:280px;pointer-events:none}
.mascot svg{width:100%;height:100%;overflow:visible}
.floater{position:fixed;right:8px;bottom:6px;width:108px;height:130px;z-index:7;pointer-events:none}
body[data-screen="home"] .floater,body[data-screen="splash"] .floater{display:none}
.mascot.cheer{animation:cheer .7s ease}

.wave-arm{transform-box:fill-box;transform-origin:128px 152px}
.back{position:fixed;left:12px;top:12px;width:92px;height:92px;border-radius:50%;border:none;background:#fff;font-size:48px;box-shadow:0 6px 0 rgba(0,0,0,.12);z-index:6}
.grid{display:grid;grid-template-columns:repeat(5,160px);gap:14px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:8px 8px 30px;margin-left:100px;height:calc(100% - 10px)}

.card{width:160px;height:170px;border:none;border-radius:26px;background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.card .e{font-size:68px;line-height:1}.card .en{font-size:24px;color:#333;margin-top:4px}.card .tt{font-size:14px;color:#888}

.letters{display:grid;grid-template-columns:repeat(9,86px);gap:8px;margin-top:8px}
.lb{height:74px;border:none;border-radius:18px;background:#fff;font-size:32px;box-shadow:0 4px 0 rgba(0,0,0,.1);color:#333}
#phshow{font-size:72px;min-height:80px}
.copy-pic{font-size:140px;line-height:1}
.copy-word{font-size:48px;color:#333}
#comic{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.palette{display:flex;gap:10px;margin:8px}
.swatch{width:64px;height:64px;border-radius:50%;min-width:64px}

<script>
const CHILD_NAME="Aaradya";
const CHILD_SAY="Aa-raa-dhya";
const WORDS=[
["👩","Mother","அம்மா","అమ్మ"],["👨","Father","அப்பா","నాన్న"],["👶","Baby","பாப்பா","పాప"],["👵","Grandma","பாட்டி","అమ్మమ్మ"],["👩‍🏫","Teacher","டீச்சர்","టీచర్"],
["💧","Water","தண்ணீர்","నీళ్ళు"],["🥛","Milk","பால்","పాలు"],["🍚","Rice","சாதம்","అన్నం"],["🍌","Banana","வாழைப்பழம்","అరటిపండు"],["🥭","Mango","மாம்பழம்","మామిడిపండు"],
["🍎","Apple","ஆப்பிள்","ఆపిల్"],["🥚","Egg","முட்டை","గుడ్డు"],["🐶","Dog","நாய்","కుక్క"],["🐱","Cat","பூனை","పిల్లి"],["🐄","Cow","பசு","ఆవు"],
["🐘","Elephant","யானை","ఏనుగు"],["🐦","Bird","பறவை","పక్షి"],["🐟","Fish","மீன்","చేప"],["🔴","Red","சிவப்பு","ఎరుపు"],["🔵","Blue","நீலம்","నీలం"],
["🟢","Green","பச்சை","ఆకుపచ్చ"],["🟡","Yellow","மஞ்சள்","పసుపు"],["👀","Eyes","கண்கள்","కళ్ళు"],["👃","Nose","மூக்கு","ముక్కు"],["👂","Ears","காதுகள்","చెవులు"],
["👄","Mouth","வாய்","నోరు"],["✋","Hand","கை","చేయి"],["📖","Book","புத்தகம்","పుస్తకం"],["✏️","Pencil","பென்சில்","పెన్సిల్"],["🎒","Bag","பை","సంచి"],["⚽","Ball","பந்து","బంతి"]];
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
function spoken(t){return String(t).split(CHILD_NAME).join(CHILD_SAY)}
$('#hi').textContent="Hello, "+CHILD_NAME+"! 👋";
document.addEventListener('gesturestart',e=>e.preventDefault());
let lastT=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastT<350)e.preventDefault();lastT=n},{passive:false});
document.addEventListener('touchmove',e=>{if(!e.target.closest('.grid,.board,.tray,canvas'))e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
let AC;
function ac(){try{const Ctor=window.AudioContext||window.webkitAudioContext;if(!Ctor)return null;if(!AC)AC=new Ctor();if(AC.state==='suspended'){const p=AC.resume();if(p&&p.catch)p.catch(()=>{})}return AC}catch(e){return null}}
function unlockAudio(){const ctx=ac();if(!ctx)return;const rate=ctx.sampleRate||22050;const n=Math.max(1,(rate*0.02)|0);const buf=ctx.createBuffer(1,n,rate);const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);try{src.start(0)}catch(e){}}
function tone(f,t0,d,type='sine',v=.2){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t0+d);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d)}
function boop(){tone(660,0,.12,'triangle',.15)}
function yay(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.3,'triangle'));clap()}
